# re-sketching-rhombus toolchain
# Rhombus packages require Racket ≥ 8.14; pin a modern Racket via mise.

[tools]
racket = "8.18"

[env]
_.path = ["{{config_root}}/bin"]

[tasks.install]
description = "Link local packages and install rhombus deps when available"
run = """
#!/usr/bin/env bash
set -euo pipefail
ROOT="$(cd "$(dirname "$0")" && pwd)"
# Prefer mise racket if present
if command -v mise >/dev/null 2>&1; then
  eval "$(mise activate bash)"
fi
raco pkg install --auto --skip-installed \
  --name re-sketching-lib "$ROOT/re-sketching-lib" \
  --name re-sketching "$ROOT/re-sketching" || true
raco pkg update --link "$ROOT/re-sketching-lib" "$ROOT/re-sketching" 2>/dev/null || \
  raco pkg install --auto --link "$ROOT/re-sketching-lib" "$ROOT/re-sketching"
# Optional Rhombus stack
raco pkg install --auto --skip-installed rhombus rhombus-draw rhombus-gui 2>/dev/null || \
  echo "note: rhombus not installed yet (need Racket >= 8.14)"
"""

[tasks.examples]
description = "List test sketches"
run = "ls -1 examples/test"

[tasks.run-sketch]
description = "Run a sketch, e.g. mise run run-sketch -- sketch1 (prefers .rhm)"
run = """
#!/usr/bin/env bash
set -euo pipefail
# Prefer mise Racket 8.18+ for Rhombus
if [[ -d "${HOME}/.local/share/mise/installs/racket/8.18/bin" ]]; then
  export PATH="${HOME}/.local/share/mise/installs/racket/8.18/bin:${PATH}"
fi
NAME="${1:-sketch1}"
if [[ -f "examples/test/${NAME}.rhm" ]]; then
  exec racket "examples/test/${NAME}.rhm"
elif [[ -f "examples/test/${NAME}.rkt" ]]; then
  exec racket "examples/test/${NAME}.rkt"
else
  echo "not found: ${NAME}" >&2
  exit 1
fi
"""

[tasks.check]
description = "Compile library and example modules"
run = """
#!/usr/bin/env bash
set -euo pipefail
if [[ -d "${HOME}/.local/share/mise/installs/racket/8.18/bin" ]]; then
  export PATH="${HOME}/.local/share/mise/installs/racket/8.18/bin:${PATH}"
fi
raco make re-sketching-lib/re_sketching/rhombus_lang.rkt
echo "racket $(racket --version)"
echo "check done"
"""

[tasks.drracket]
description = "Launch DrRacket 8.18 (not system 8.10). Args: optional files"
run = """
#!/usr/bin/env bash
set -euo pipefail
export PATH="${HOME}/.local/share/mise/installs/racket/8.18/bin:${PATH}"
echo "Using: $(which drracket)"
echo "Racket: $(racket --version)"
exec drracket "$@"
"""
